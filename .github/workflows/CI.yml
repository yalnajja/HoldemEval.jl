name: CI

on:
  push:
    branches:
      - main
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - 'lts'
          - 'pre'
        os:
          - ubuntu-latest
        combinatorics_version:
          - '1.0.0'   # Minimum version you support
          - '1.1.0'   # An intermediate version
          - 'latest'  # Latest released version

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      # --- CUSTOM STEP: Override Combinatorics.jl Version ---
      - name: Pin Combinatorics.jl version
        if: matrix.combinatorics_version != 'latest'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="Combinatorics", version="${{ matrix.combinatorics_version }}"))
          Pkg.resolve()

      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest'

      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest'
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  aqua:
    name: Code Quality (Aqua.jl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run Aqua tests
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add("Aqua")
          Pkg.develop(PackageSpec(path=pwd()))
          using Aqua, HoldemEval
          Aqua.test_all(HoldemEval; stale_deps=false)